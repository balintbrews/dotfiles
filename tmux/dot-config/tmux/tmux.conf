# Remap the prefix from C-b to C-a.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Pass through extended key sequences to applications.
set -g extended-keys on
set -g extended-keys-format csi-u

# Pass through application escape sequences (e.g. OSC) to the terminal.
set -g allow-passthrough on

# Start window numbering at 1.
set -g base-index 1

# Allow mouse interactions.
set -g mouse on

# Open new panes and windows from the current pane's working directory.
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Open or return to a persistent popup scoped to the current pane.
bind-key p run-shell 'popup_session="popup-$(tmux display-message -p "#{session_name}-#{window_name}-#{pane_id}")"; popup_dir="$(tmux display-message -p "#{pane_current_path}")"; tmux display-popup -d "$popup_dir" -E "env TMUX= tmux new-session -A -s $(printf %q "$popup_session") -c $(printf %q "$popup_dir")"'

# Keep pane dividers subtle and uniform.
set -g pane-border-style "fg=colour235"
set -g pane-active-border-style "fg=colour235"

# Keep the status line minimal with windows on the right.
set -g status-position bottom
set -g status-justify right
set -g status-style "bg=default,fg=default"
set -g status-left-length 24
set -g status-right-length 0

# Show the session name on the left; leave the right side for window tabs.
set -g status-left "#[dim] #S #[nodim]"
set -g status-right ""

# Use compact window labels with clearer active/activity states.
set -g window-status-separator ""
set -g window-status-format "#[dim]#[range=window|#{window_index}] #I:#W #[norange]#[default]#{?window_end_flag,,  }"
set -g window-status-current-format "#[underscore,bold]#[range=window|#{window_index}] #I:#W #[norange]#[default]#{?window_end_flag,,  }"
set -g window-status-activity-style "underscore"
set -g window-status-bell-style "reverse,bold"

# Build a two-line status bar with a padded top row.
set -g status 2
set -g status-format[0] "#[bg=default] "
set -g status-format[1] "#[align=left]#{T:status-left}#[align=right]#{W:#{E:window-status-format},#{E:window-status-current-format}}"
